<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Usic - Web Music Player</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />

        <!-- Stylesheets -->
        <link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/music-list.css" />
        <link rel="stylesheet" href="css/artist-podcast.css" />
        <link rel="stylesheet" href="css/user-system.css" />
    </head>
    <body>
        <div class="app-layout" id="app-layout">
            <!-- Sidebar kiri -->
            <aside class="sidebar-left">
                <div class="brand-logo">
                    <div class="logo-icon">
                        <i class="fa-solid fa-wave-square"></i>
                    </div>
                    <span>Usic</span>
                </div>

                <nav class="main-nav">
                    <ul>
                        <li>
                            <a
                                href="#"
                                class="nav-link active"
                                data-target="home"
                                >Home</a
                            >
                        </li>
                        <li>
                            <a href="#" class="nav-link" data-target="search"
                                >Search</a
                            >
                        </li>
                        <li>
                            <a href="#" class="nav-link" data-target="album"
                                >Albums</a
                            >
                        </li>
                    </ul>
                </nav>

                <div class="library-section">
                    <div class="section-header">
                        <span>YOUR LIBRARY</span>
                        <a
                            href="#"
                            class="see-all nav-link"
                            data-target="library"
                            >See all</a
                        >
                    </div>
                    <ul class="library-list">
                        <li
                            class="library-item nav-link"
                            data-target="playlist"
                        >
                            <div class="item-thumb">
                                <i class="fa-solid fa-music"></i>
                            </div>
                            <div class="item-info">
                                <h4>Chill Vibes Lounge</h4>
                                <p>Playlist</p>
                            </div>
                        </li>
                        <li class="library-item nav-link" data-target="artist">
                            <div class="item-thumb">
                                <i class="fa-regular fa-user"></i>
                            </div>
                            <div class="item-info">
                                <h4>Sia</h4>
                                <p>Artist</p>
                            </div>
                        </li>
                        <li class="library-item nav-link" data-target="album">
                            <div class="item-thumb">
                                <i class="fa-solid fa-compact-disc"></i>
                            </div>
                            <div class="item-info">
                                <h4>Harry Styles</h4>
                                <p>Album</p>
                            </div>
                        </li>
                        <li
                            class="library-item nav-link"
                            data-target="playlist"
                        >
                            <div class="item-thumb">
                                <i class="fa-solid fa-music"></i>
                            </div>
                            <div class="item-info">
                                <h4>Road Trip Mixtape</h4>
                                <p>Playlist</p>
                            </div>
                        </li>
                        <li class="library-item nav-link" data-target="album">
                            <div class="item-thumb">
                                <i class="fa-solid fa-compact-disc"></i>
                            </div>
                            <div class="item-info">
                                <h4>Past Life</h4>
                                <p>Album</p>
                            </div>
                        </li>
                    </ul>
                </div>
            </aside>

            <!-- Area tengah -->
            <div class="center-wrapper">
                <header class="top-bar">
                    <div class="top-left"></div>

                    <div class="top-search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input
                            type="text"
                            placeholder="Search tracks, artists, albums..."
                        />
                    </div>

                    <div class="top-right">
                        <button
                            class="icon-btn notif-btn"
                            aria-label="Notifications"
                        >
                            <i class="fa-regular fa-bell"></i>
                        </button>
                        <div
                            class="user-profile-pill nav-link"
                            data-target="settings"
                        >
                            <div class="avatar-circle">
                                <i class="fa-regular fa-user"></i>
                            </div>
                            <span>User</span>
                            <i
                                class="fa-solid fa-chevron-down"
                                style="font-size: 0.7rem; color: #999"
                            ></i>
                        </div>
                    </div>
                </header>

                <!-- Konten halaman dinamis -->
                <main id="main-content"></main>
            </div>

            <!-- Sidebar kanan (muncul saat lagu diklik) -->
            <aside class="sidebar-right" id="sidebar-right">
                <div class="now-playing-panel">
                    <div class="vinyl-cover">
                        <div class="vinyl-disc" id="vinyl-disc">
                            <div class="vinyl-center"></div>
                        </div>
                        <div class="vinyl-info">
                            <h3 id="np-title">Thunderclouds</h3>
                            <p id="np-artist">LSD (Sia, Diplo, Labrinth)</p>
                        </div>
                    </div>

                    <div class="np-controls">
                        <button
                            class="np-btn like-btn"
                            id="np-like"
                            aria-label="Like"
                        >
                            <i class="fa-regular fa-heart"></i>
                        </button>
                        <button class="np-btn" aria-label="Shuffle">
                            <i class="fa-solid fa-shuffle"></i>
                        </button>
                        <button
                            class="np-btn"
                            id="np-prev"
                            aria-label="Previous"
                        >
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button
                            class="np-play-btn"
                            id="np-play"
                            aria-label="Play/Pause"
                        >
                            <i class="fa-solid fa-pause"></i>
                        </button>
                        <button class="np-btn" id="np-next" aria-label="Next">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <button class="np-btn" aria-label="Repeat">
                            <i class="fa-solid fa-repeat"></i>
                        </button>
                        <button
                            class="np-btn nav-link"
                            data-target="lyrics"
                            aria-label="Lyrics"
                        >
                            <i class="fa-regular fa-file-lines"></i>
                        </button>
                    </div>

                    <div class="np-progress">
                        <span id="np-current">0:00</span>
                        <div class="np-bar-bg">
                            <div
                                class="np-bar-fill"
                                id="np-bar-fill"
                                style="width: 0%"
                            ></div>
                        </div>
                        <span id="np-duration">3:37</span>
                    </div>
                </div>
            </aside>
        </div>

        <script src="js/app.js"></script>
    </body>
</html>
