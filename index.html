<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Usic - Web Music Player</title>
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />

        <!-- Stylesheets -->
        <link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/music-list.css" />
        <link rel="stylesheet" href="css/artist-podcast.css" />
        <link rel="stylesheet" href="css/user-system.css" />
    </head>
    <body>
        <div class="app-layout" id="app-layout">
            <!-- Sidebar kiri -->
            <aside class="sidebar-left">
                <div class="brand-logo">
                    <div class="logo-icon">
                        <i class="fa-solid fa-wave-square"></i>
                    </div>
                    <span>Usic</span>
                </div>

                <nav class="main-nav">
                    <ul>
                        <li>
                            <a
                                href="#"
                                class="nav-link active"
                                data-target="home"
                                aria-label="Home"
                                title="Home"
                            >
                                <i class="fa-solid fa-house nav-icon" aria-hidden="true"></i>
                                <span class="nav-label">Home</span>
                            </a>
                        </li>
                        <li>
                            <a
                                href="#"
                                class="nav-link"
                                data-target="search"
                                aria-label="Search"
                                title="Search"
                            >
                                <i class="fa-solid fa-magnifying-glass nav-icon" aria-hidden="true"></i>
                                <span class="nav-label">Search</span>
                            </a>
                        </li>
                        <li>
                            <a
                                href="#"
                                class="nav-link"
                                data-target="album"
                                aria-label="Albums"
                                title="Albums"
                            >
                                <i class="fa-solid fa-compact-disc nav-icon" aria-hidden="true"></i>
                                <span class="nav-label">Albums</span>
                            </a>
                        </li>
                        <li>
                            <a
                                href="#"
                                class="nav-link"
                                data-target="library"
                                aria-label="Library"
                                title="Library"
                            >
                                <i class="fa-solid fa-book-open nav-icon" aria-hidden="true"></i>
                                <span class="nav-label">Library</span>
                            </a>
                        </li>
                    </ul>
                </nav>

                <div class="library-section">
                    <div class="section-header">
                        <span>YOUR LIBRARY</span>
                        <div class="library-header-actions">
                            <button
                                type="button"
                                class="library-add-button"
                                data-create-library-shortcut
                                aria-label="Buat Library"
                                title="Buat Library"
                            >
                                <i class="fa-solid fa-plus"></i>
                            </button>
                            <a
                                href="#"
                                class="see-all nav-link"
                                data-target="library"
                                >See all</a
                            >
                        </div>
                    </div>
                    <ul class="library-list" id="user-library-list"></ul>
                </div>
            </aside>

            <!-- Area tengah -->
            <div class="center-wrapper">
                <header class="top-bar">
                    <div class="top-left"></div>

                    <div class="top-search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input
                            type="text"
                            placeholder="Search tracks, artists, albums..."
                        />
                    </div>

                    <div class="top-right">
                        <button
                            class="icon-btn"
                            id="theme-toggle"
                            aria-label="Toggle Theme"
                        >
                            <i class="fa-regular fa-sun"></i>
                        </button>
                        <button
                            class="icon-btn notif-btn"
                            aria-label="Notifications"
                        >
                            <i class="fa-regular fa-bell"></i>
                        </button>
                        <div
                            class="user-profile-pill nav-link"
                            data-target="settings"
                        >
                            <div class="avatar-circle">
                                <i class="fa-regular fa-user"></i>
                            </div>
                            <span>User</span>
                            <i
                                class="fa-solid fa-chevron-down"
                                style="
                                    font-size: 0.7rem;
                                    color: var(--text-muted);
                                "
                            ></i>
                        </div>
                    </div>
                </header>

                <!-- Konten halaman dinamis -->
                <main id="main-content"></main>
            </div>

            <!-- Sidebar kanan (muncul saat lagu diklik) -->
            <aside class="sidebar-right" id="sidebar-right">
                <div class="now-playing-panel">
                    <button
                        class="np-close-btn"
                        id="np-close"
                        aria-label="Minimize Player"
                    >
                        <i class="fa-solid fa-xmark"></i>
                    </button>

                    <div class="vinyl-cover">
                        <div class="vinyl-disc" id="vinyl-disc">
                            <div class="vinyl-center"></div>
                        </div>
                        <div class="vinyl-info">
                            <h3 id="np-title">Thunderclouds</h3>
                            <p id="np-artist">LSD (Sia, Diplo, Labrinth)</p>
                        </div>
                    </div>

                    <div class="np-controls">
                        <button
                            class="np-btn like-btn"
                            id="np-like"
                            aria-label="Tambah atau hapus dari Liked Songs"
                            aria-pressed="false"
                        >
                            <i class="fa-regular fa-heart"></i>
                        </button>
                        <button class="np-btn" aria-label="Shuffle">
                            <i class="fa-solid fa-shuffle"></i>
                        </button>
                        <button
                            class="np-btn"
                            id="np-prev"
                            aria-label="Previous"
                        >
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button
                            class="np-play-btn"
                            id="np-play"
                            aria-label="Play/Pause"
                        >
                            <i class="fa-solid fa-pause"></i>
                        </button>
                        <button class="np-btn" id="np-next" aria-label="Next">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                        <button class="np-btn" aria-label="Repeat">
                            <i class="fa-solid fa-repeat"></i>
                        </button>
                        <button
                            class="np-btn nav-link"
                            data-target="lyrics"
                            aria-label="Lyrics"
                        >
                            <i class="fa-regular fa-file-lines"></i>
                        </button>
                        <button
                            class="np-btn"
                            id="np-add-to-library"
                            aria-label="Tambahkan lagu ke Library"
                            aria-expanded="false"
                            aria-controls="player-library-picker"
                        >
                            <i class="fa-solid fa-folder-plus"></i>
                        </button>
                    </div>

                    <div class="player-library-picker" id="player-library-picker" hidden>
                        <label for="player-library-select">Tambahkan lagu ke Library</label>
                        <div class="player-library-picker-controls">
                            <select id="player-library-select">
                                <option value="">Pilih Library</option>
                            </select>
                            <button type="button" id="player-library-add">Tambah</button>
                        </div>
                        <p id="player-library-status" role="status" aria-live="polite"></p>
                    </div>

                    <div class="np-progress">
                        <span id="np-current">0:00</span>
                        <div class="np-bar-bg">
                            <div
                                class="np-bar-fill"
                                id="np-bar-fill"
                                style="width: 0%"
                            ></div>
                        </div>
                        <span id="np-duration">3:37</span>
                    </div>
                </div>
            </aside>

            <!-- Mini player di HP saat panel penuh di-minimize -->
            <div class="mini-player" id="mini-player">
                <div class="mini-player-info" id="mini-player-expand">
                    <div class="mini-thumb">
                        <i class="fa-solid fa-music"></i>
                    </div>
                    <div class="mini-text">
                        <h4 id="mini-title">Thunderclouds</h4>
                        <p id="mini-artist">LSD (Sia, Diplo, Labrinth)</p>
                    </div>
                </div>
                <div class="mini-controls">
                    <button
                        class="mini-ctrl-btn"
                        id="mini-prev"
                        aria-label="Previous"
                    >
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button
                        class="mini-play-btn"
                        id="mini-play"
                        aria-label="Play/Pause"
                    >
                        <i class="fa-solid fa-pause"></i>
                    </button>
                    <button
                        class="mini-ctrl-btn"
                        id="mini-next"
                        aria-label="Next"
                    >
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>
                <div class="mini-progress-bg">
                    <div
                        class="mini-progress-fill"
                        id="mini-bar-fill"
                        style="width: 0%"
                    ></div>
                </div>
            </div>
        </div>

        <script src="js/app.js"></script>
    </body>
</html>
